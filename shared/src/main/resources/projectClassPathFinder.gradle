import org.gradle.api.attributes.Attribute

def androidCompileClasspath = { configuration ->
    configuration.incoming.artifactView {
        attributes {
            attribute(Attribute.of("artifactType", String), "android-classes-jar")
        }
    }.files
}

allprojects { project ->
    def modernAndroidComponents = null
    def androidVariantConfigurations = []
    ["com.android.application", "com.android.library", "com.android.dynamic-feature", "com.android.test"].each { pluginId ->
        project.plugins.withId(pluginId) {
            // The new Android DSL no longer exposes the legacy boot/variant APIs.
            if (!project.android.metaClass.respondsTo(project.android, "getBootClasspath")) {
                modernAndroidComponents = project.extensions.getByName("androidComponents")
                modernAndroidComponents.onVariants(modernAndroidComponents.selector().all(), { variant ->
                    androidVariantConfigurations.add(variant.compileConfiguration)
                } as org.gradle.api.Action)
            }
        }
    }

    task kotlinLSPProjectDeps { task ->
        doLast {
            System.out.println ""
            System.out.println "gradle-version $gradleVersion"
            System.out.println "kotlin-lsp-project ${project.name}"

            if (modernAndroidComponents != null) {
                modernAndroidComponents.sdkComponents.bootClasspath.get().each {
                    System.out.println "kotlin-lsp-gradle ${it.asFile}"
                }
                androidVariantConfigurations.each { configuration ->
                    androidCompileClasspath(configuration).each {
                        System.out.println "kotlin-lsp-gradle $it"
                    }
                }
            } else if (project.hasProperty('android')) {
                project.android.getBootClasspath().each {
                    System.out.println "kotlin-lsp-gradle $it"
                }

                def variants = []

                if (project.android.hasProperty('applicationVariants')) {
                    variants += project.android.applicationVariants
                }

                if (project.android.hasProperty('libraryVariants')) {
                    variants += project.android.libraryVariants
                }

                variants.each { variant ->
                    def variantBase = variant.baseName.replaceAll("-", File.separator)

                    def buildClasses = project.getBuildDir().absolutePath +
                        File.separator + "intermediates" +
                        File.separator + variantBase +
                        File.separator + "classes"

                    System.out.println "kotlin-lsp-gradle $buildClasses"

                    def userClasses = project.getBuildDir().absolutePath +
                        File.separator + "intermediates" +
                        File.separator + "javac" +
                        File.separator + variantBase +
                        File.separator + "compile" + variantBase.capitalize() + "JavaWithJavac" + File.separator + "classes"

                    System.out.println "kotlin-lsp-gradle $userClasses"

                    def userVariantClasses = project.getBuildDir().absolutePath +
                        File.separator + "intermediates" +
                        File.separator + "javac" +
                        File.separator + variantBase +
                        File.separator + "classes"

                    System.out.println "kotlin-lsp-gradle $userVariantClasses"

                    androidCompileClasspath(variant.getCompileConfiguration()).each {
                        System.out.println "kotlin-lsp-gradle $it"
                    }
                }
            } else if (project.hasProperty('sourceSets')) {
                // Print the list of all dependencies jar files.
                sourceSets.forEach {
                    it.compileClasspath.forEach {
                        System.out.println "kotlin-lsp-gradle $it"
                    }
                }
            }


            // handle kotlin multiplatform style dependencies if any
            def kotlinExtension = project.extensions.findByName("kotlin")
            if(kotlinExtension && kotlinExtension.hasProperty("targets")) {
                def kotlinSourceSets = kotlinExtension.sourceSets

                // Print the list of all dependencies jar files.
                // Native/JS targets do not expose JVM JAR compile classpaths.
                kotlinExtension.targets.findAll { it.platformType.toString() in ["androidJvm", "jvm"] }.each { target ->
                    def classpath = configurations["${target.name}CompileClasspath"]
                    def files = target.platformType.toString() == "androidJvm"
                        ? androidCompileClasspath(classpath)
                        : classpath.files
                    files.each {
                        System.out.println "kotlin-lsp-gradle $it"
                    }
                }
            }
        }
    }

    task kotlinLSPAllGradleDeps {
        doLast {
            fileTree("$gradle.gradleHomeDir/lib")
                .findAll { it.toString().endsWith '.jar' }
                .forEach { System.out.println "kotlin-lsp-gradle $it" }
        }
    }
}
